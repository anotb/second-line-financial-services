source_anchor:
  - EBA DORA register of information preparation materials
  - EBA DORA oversight materials
scenario: Public-source-derived DORA-style ICT arrangement entry without named providers
register_entry:
  arrangement_id: ROI-ICT-0001
  contractual_arrangement_type: outsourced_ict_service
  ict_service_type: cloud_hosting_and_managed_data_processing
  supported_function: customer-facing digital channel and internal risk reporting data pipeline
  critical_or_important_function: true
  ict_third_party_service_provider_status: provider_identifier_and_service_role_required
  provider_identifier_status: lei_or_euid_required_where_available
  subcontractor_information_status: incomplete_subcontractor_chain_requires_follow_up
  data_location_status: primary_and_backup_processing_locations_required
  exit_plan_status: draft_exit_plan_available_but_not_tested
  concentration_risk_flag: true
  evidence_required:
    - executed contract and amendments
    - ICT service description
    - subcontractor list
    - data processing and location schedule
    - business owner criticality assessment
    - exit strategy and last test result
human_review_gate: DORA register owner and legal or compliance reviewer must approve before submission to competent authority.
